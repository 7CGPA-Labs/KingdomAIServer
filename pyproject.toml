[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kingdom-ai-server"
version = "1.0.0"
description = "Dedicated local OpenAI-Compatible AI Server for Continue.dev"
authors = [{ name = "Kingdom AI Server Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "onnxruntime>=1.15.0",
    "psutil>=5.9.0",
    "httpx>=0.24.0",
    "pystray>=0.19.4",
    "Pillow>=9.0.0",
    "huggingface_hub>=0.20.0",
    "truststore>=0.8.0",
    "llama-cpp-python>=0.2.0",
]

[project.scripts]
kingdom = "kingdom_server.cli.commands:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
