[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kingdom-ai-server"
version = "2.0.0"
description = "Dedicated local OpenAI-Compatible AI Server for Continue.dev & WebUI (GGUF Engine)"
authors = [{ name = "Kingdom AI Server Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "llama-cpp-python>=0.2.75",
    "tree-sitter>=0.20.0",
    "sqlite-vec>=0.1.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "httpx>=0.24.0",
    "jinja2>=3.1.0",
    "truststore>=0.8.0",
    "pillow>=9.0.0",
    "requests>=2.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
