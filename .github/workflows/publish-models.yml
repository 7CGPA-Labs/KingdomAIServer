name: Publish Model Weights to GitHub Release Mirror

on:
  workflow_dispatch:

jobs:
  publish-models:
    name: Download & Publish GGUF Model Binaries (v2.0.0-models)
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Model Downloader Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install huggingface_hub truststore httpx rich

      - name: Download Model Artifacts from Source (HuggingFace Hub)
        env:
          SKIP_GITHUB_MIRROR: "1"
        run: |
          python -c "from src.utils.downloader import ModelDownloader; from pathlib import Path; ModelDownloader(Path('dist_models')).auto_provision_missing()"

      - name: Publish Models to GitHub Release Mirror (v2.0.0-models)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if (gh release view v2.0.0-models 2>$null) {
              gh release delete v2.0.0-models -y --cleanup-tag
          }
          gh release create v2.0.0-models dist_models/* --title "Kingdom AI Server GGUF Model Weights Mirror" --notes "Pre-built Main Boss GGUF and Lean 3-Minister Council model binary artifacts for corporate proxy fallbacks"
