name: Publish Model Weights to GitHub Release Mirror

on:
  workflow_dispatch:

jobs:
  publish-models:
    name: Download & Publish ONNX Model Binaries (v1.0.0-models)
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Model Downloader Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install huggingface_hub truststore httpx rich

      - name: Download Model Artifacts from Source (HuggingFace / ONNX Community)
        env:
          SKIP_GITHUB_MIRROR: "1"
        run: |
          python -c "from kingdom_server.utils.downloader import ModelDownloader; from pathlib import Path; ModelDownloader(Path('dist_models')).auto_provision_missing()"

      - name: Publish Models to GitHub Release Mirror (v1.0.0-models)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0-models -y --cleanup-tag || true
          gh release create v1.0.0-models dist_models/* --title "Kingdom AI Server Model Weights Mirror" --notes "Pre-built INT4 Quantized ONNX and INT8 ONNX model binary artifacts for corporate proxy fallbacks"
