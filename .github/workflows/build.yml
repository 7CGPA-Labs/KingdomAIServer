name: Build & Package Kingdom AI Server

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Package Kingdom AI WebUI & Enterprise Server
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest pillow pystray truststore huggingface_hub onnxruntime-directml onnxruntime-genai-directml

      - name: Run Verification & Test Suite
        run: |
          pytest -v --tb=short

      - name: Package Release ZIP
        run: |
          python build/package_release.py

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingdomServer-win64-full
          path: release/KingdomServer-win64-full.zip
          retention-days: 30

      - name: Publish Release Bundle (v1.0.0)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 release/KingdomServer-win64-full.zip --title "Kingdom AI Server & Open WebUI v1.0.0 Release" --notes "Zero-Admin Enterprise WebUI & Python Server Bundle for Windows x64" --clobber || gh release upload v1.0.0 release/KingdomServer-win64-full.zip --clobber
