name: Build & Package Kingdom AI Studio V3

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Package Kingdom AI Studio V3 Desktop Bundle
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest truststore llama-cpp-python slint

      - name: Run Verification & Test Suite
        run: |
          pytest -v --tb=short

      - name: Package Release ZIP
        run: |
          python build/package_release.py

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingdomServer-win64-full
          path: release/KingdomServer-win64-full.zip
          retention-days: 30

      - name: Publish Release Bundle
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $releaseTag = if ($env:GITHUB_REF -match '^refs/tags/(v.+)') { $matches[1] } else { "v3.0.0" }
          Write-Host "Target Release Tag: $releaseTag"
          if (gh release view $releaseTag 2>$null) {
              gh release upload $releaseTag release/KingdomServer-win64-full.zip --clobber
          } else {
              gh release create $releaseTag release/KingdomServer-win64-full.zip --title "Kingdom AI Studio $releaseTag - Google Antigravity GUI Desktop Release" --notes "Production-Grade Standalone On-Device AI Coding Assistant (Slint Native Desktop GUI, <=6GB VRAM, Zero-Server In-Process Engine)"
          }
