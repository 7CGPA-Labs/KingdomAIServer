name: Build & Package Kingdom AI Server

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest pyinstaller pillow pystray truststore huggingface_hub llama-cpp-python onnxruntime-directml

      - name: Run Verification & Test Suite
        run: |
          pytest -v --tb=short

      - name: Compile Executable Binary via PyInstaller
        run: |
          pyinstaller --noconfirm build/kingdom.spec

      - name: Package Release ZIP
        run: |
          python build/package_release.py

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingdomServer-win64-full
          path: release/KingdomServer-win64-full.zip
          retention-days: 30

      - name: Publish Binary Release ZIP (v1.0.0)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 release/KingdomServer-win64-full.zip --title "Kingdom AI Server v1.0.0 Release" --notes "Standalone PyInstaller Executable Distribution for Windows x64 compiled clean in GitHub Actions" --clobber || gh release upload v1.0.0 release/KingdomServer-win64-full.zip --clobber

      - name: Provision Model Binaries for GitHub Releases Mirror
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python upload_models.py

      - name: Publish Models to GitHub Release Mirror (v1.0.0-models)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0-models dist_models/* --title "Kingdom AI Server Model Weights Mirror" --notes "Pre-built GGUF and ONNX model binary artifacts for corporate proxy fallbacks" --clobber || gh release upload v1.0.0-models dist_models/* --clobber
